name: Comprobar compilación iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar sin firma
        run: >
          xcodebuild
          -project QipiGo.xcodeproj
          -scheme QipiGo
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - uses: actions/upload-artifact@v4
        with:
          name: QipiGo-compilacion-sin-firma
          path: build/Build/Products/Debug-iphoneos/QipiGo.app
